    # Interceptar endpoints de dispositivos y validación de la app Mobile
    # Interceptar endpoints de validity, usage y mobile
 # Captura cualquier URL que contenga usage, validity, mobile o braintree
# Interceptar endpoints de dispositivos y validación de la app Mobile
location ~* ^/v2/(accounts/[^/]+)/ports {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Auth-Token $http_x_auth_token;
    proxy_set_header Access-Control-Allow-Origin "*";
}
location ~* ^/v2/(accounts/[^/]+)/usage {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Auth-Token $http_x_auth_token;
    proxy_set_header Access-Control-Allow-Origin "*";
}
location ~* ^/v2/(accounts/[^/]+)/(devices/[^/]+)/usage {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Auth-Token $http_x_auth_token;
    proxy_set_header Access-Control-Allow-Origin "*";
}

