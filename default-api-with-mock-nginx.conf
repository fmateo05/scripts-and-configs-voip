# Declarar un backend objetivo basado en el método HTTP
map $request_method $devices_backend {
   DELETE  http://127.0.0.1:8000;     # API real de Kazoo Crossbar
   GET  http://127.0.0.1:8000;     # API real de Kazoo Crossbar
    default     http://127.0.0.1:5000;              # Mock en Python (puerto 5000)
}
server {
    listen 8001;
    server_name portal.bevoip.net;

    # 1. EXCEPCIÓN: Servir el js/config.js de forma local
